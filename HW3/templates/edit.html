{% extends "base.html" %}
{% block title %}Todo List - Todo App{% endblock %}
{% block content %}
<h2>할 일 수정</h2>
<form method="post">
    <input type="text" name="todo" required value="{{ todo.text }}">
    <input type="text" name="note" value="{{ todo.note }}">
    <button type="submit">저장</button>
</form>

<a href="{{ url_for('index') }}">목록으로</a>
{% endblock %}
